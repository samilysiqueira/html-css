<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formúlario</title>
</head>
<body>
    <h1>Semana tech</h1>
    <legend>Dados pessoais</legend>
    <form action="" method="get">
     <p><label for="inome">Nome:</label>
    <input type="text" name="nome" id="inome" required placeholder="Nome completo">
    </p>

    <p><label for="email">E-mail: </label>
    <input type="email" name="email" id="iemail" required>
    </p>

    <p><label for="senha">Senha: </label>
    <input type="password" name="senha" id="isenha" min="5" max="8">
    </p>
    <p>
     <label for="tel">Telefone: </label>
     <input type="tel" name="tel" id="itel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" required placeholder="(xx)xxxxx-xxxx">
    </p>

    <p>
        <label for="idade">Idade: </label>
        <input type="number" name="idade" id="iidade" required min="1" max="90" step="1">
    </p>

    <p>
        <label for="data">Data de nasciemnto: </label>
        <input type="date" name="data" id="idata" required>
    </p>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FlexBox</title>
    
</head>
<body>
    <header>
        <h1>Sneaky</h1>
        <p>Seu estilo. Seu passo.</p>

        <nav>
            <a href="#">Inicio</a>
            <a href="#">Tenis</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>
    </header>
    <main>
        <h1>Encontre seu próximo par.</h1>
        <p>Tênis que combinam com seu estilo, sua personalidade e seu dia a dia.</p>
        <button class="botao">Ver tênis</button>

        <section class="produto">
            <div class="tenis01">
                <img src="imagens/airmax.jpg" alt="tenis Air Max">
                <h3>Air Max</h3>
                <p>R$ 499,90</p>
                <button>Comprar</button>
            </div>

            <div class="tenis02">
                <img src="imagens/jordan.jpg" alt="Tenis Jordan">
                <h3>Jordan</h3>
                <p>R$699,90</p>
                <button>Comprar</button>
            </div>

            <div class="tenis03">
                <img src="imagens/dunk.jpg" alt="Tenis dunk">
                <h3>Dunk</h3>
                <p>R$599,90</p>
                <button>Comprar</button>
            </div>

            <div class="tenis04">
                <img src="imagens/airforce.webp" alt="Tenis Air Force">
                <h3>Air Force</h3>
                <p>R$549,90</p>
                <button>Comprar</button>
            </div>

            <div class="tenis05">
                <img src="imagens/cortez.webp" alt="Tenis Cortez">
                <h3>Cortez</h3>
                <p>R$399,90</p>
                <button>Comprar</button>
            </div>

            <div class="tenis06">
                <img src="imagens/blazer.jpg" alt="Tenis Blazer">
                <h3>Blazer</h3>
                <p>R$449,90</p>
                <button>Comprar</button>
            </div>
        </section>
    </main>
</body>
</html>

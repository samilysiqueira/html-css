<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
     body{
        font-family: Arial, Helvetica, sans-serif;
     }

        table{
            border-collapse: collapse;
            width: 400px;
        }
 
        caption{
            font-size: 1.5rm;
            font-weight: bold;
            padding: 5px;
        } 

        thead, .media tr:nth-child(2n){
            background-color: gray;
        }
       
        thead{
            background-color: gray;
            color: white;
        }
      
      .media{
        background-color: gray;
        color: white;
      }

        th, td{
            border: 1px solid black;
            padding: 5px;
            
        }
    </style>
</head>
<body>
    <table>
     <caption>Lista de alunos</caption>
     <thead>
          <tr>
            <th rowspan="2" scope="row">Aréa</th>
            <th rowspan="2" scope="row">Diciplinas</th>
            <th colspan="2" scope="col">Notas</th>
            <th rowspan="2" scope="rowgroup">Média</th>
          </tr>

          <tr>
            <td>Nota 1 </td>
            <td>Nota 2</td>
          </tr>
     </thead>

     <tbody>
        <tr>
            <th rowspan="4" scope="rowgroup">Exatas</th>
            <td>Matematica</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <td>Física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <td>Quimica</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
            
        </tr>

        <tr>
            <td>Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr class="media">
            <td colspan="4" >Média de exatas</td>
            <td>0.0</td>
</tr>

        <tr>
        <th rowspan="2" scope="rowgroup">Humanas</th>    
        <td>Historia</td>
        <td>0.0</td>
        <td>0.0</td>
        <td>0.0</td>
        </tr>

        <tr>
            <td>Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr  class="media">
            <td colspan="4">Média de humanas</td>
            <td>0.0</td>
        </tr>
     </tbody>
    </table>
</body>
</html>

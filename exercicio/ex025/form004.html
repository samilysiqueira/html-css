<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de formulario</title>
    <style>
     
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-image: linear-gradient(to right, #F29199,#F2BDC1 );
          
        }

        fieldset{
            width: 500px;
            height: 300px;
           
        }

        .campo{
         width: 80%;      
         height: 45px;    
         font-size: 15px; 
       
         border-radius: 10px
          }
  
    </style>
</head>
<body>
    <form action="cadastro.php" method="get" autocomplete="on">
     <legend>Dados pessoais</legend>        
            <p>
                <label for="inome">Nome</label>
                <input class="campo" type="text" name="nome" id="inome" minlength="5" maxlength="20">
            </p>
                <p>
            <label for="iemail">E-mail</label>
            <input class="campo" type="email" name="email" id="iemail" required autocomplete="email">
                </p>
                <p>
            <label for="itel">Telefone</label>
            <input class="campo" type="tel" name="tel" id="itel" autocomplete="tel" pattern="\(\d{2})\d{4,5}-{4}/" required placeholder="(xx)xxxxx-xxxx">
            
                </p>
                <p>
                <!--Estudar mais sobre RegEx-->
                </p>
                <p>
            <input  type="submit" value="Enviar">
            <input type="reset" value="Limpar">
                </p>
        
    </form>
</body>
</html>
